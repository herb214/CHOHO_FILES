# 复制到 /etc/nginx/sites-available/omi（与 publish-omi-to-ecs.ps1 配套）
# 首次启用前请移除默认站点：sudo rm -f /etc/nginx/sites-enabled/default
# 若本机还有其他站点，勿用 default_server，改为 server_name 你的域名;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/omi;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 可选：避免中文文件名在部分客户端乱码
    charset utf-8;
}
