# GitHub Pages：仅发布对外 PDF / 扫码页（不含内部地图与区域报告）
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble public-only site
        run: |
          set -e
          mkdir -p _site
          cp -r public/* _site/
          rm -f _site/google-drive-link.txt
          touch _site/.nojekyll
          python - <<'PY'
          import pathlib
          drive = "#"
          cfg = pathlib.Path("public/google-drive-link.txt")
          if cfg.is_file():
              for line in cfg.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if line.startswith("https://drive.google.com/"):
                      drive = line
                      break
          html = pathlib.Path("_site/index.html").read_text(encoding="utf-8")
          pathlib.Path("_site/index.html").write_text(
              html.replace("__GOOGLE_DRIVE_URL__", drive), encoding="utf-8"
          )
          print("Google Drive URL:", drive if drive.startswith("https") else "(hidden)")
          PY

      - name: Generate QR (PDF on GitHub Pages)
        run: |
          pip install 'qrcode[pil]' -q
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PDF_URL="https://${OWNER}.github.io/${REPO}/qingdao-zhenghe-sample-2026.pdf"
          python - <<PY
          import qrcode
          url = "${PDF_URL}"
          qrcode.make(url, box_size=8, border=2).save("_site/sample-qr.png")
          print("QR encodes:", url)
          PY
          if [ -f _site/sample-qr.html ]; then
            sed -i "s|http://8.136.202.129/public/qingdao-zhenghe-sample-2026.pdf|${PDF_URL}|g" _site/sample-qr.html
            sed -i "s|/public/qingdao-zhenghe-sample-2026.pdf|/qingdao-zhenghe-sample-2026.pdf|g" _site/sample-qr.html
            sed -i 's|href="qingdao-zhenghe-sample-2026.pdf"|href="'"${PDF_URL}"'"|g' _site/sample-qr.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
