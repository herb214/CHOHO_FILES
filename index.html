<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ACS · 海外市场情报库 · 车辆销售数据</title>
<style>
:root{
  --ink:#0a0e27;
  --brand:#1a237e;
  --brand-mid:#283593;
  --brand-soft:#e8eaf6;
  --gold:#c5a059;
  --card:#ffffff;
  --muted:#6b7280;
  --radius-lg:16px;
  --radius-md:12px;
  --shadow-soft:0 4px 24px rgba(13,14,39,.08);
  --shadow-lift:0 12px 40px rgba(26,35,126,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,#eef1f8 0%,#f4f5f7 32%,#e8ecf4 100%);
  color:#222;
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
  position:relative;
}
body > *{position:relative;z-index:1}

header.page-head{
  background:linear-gradient(125deg,#060818 0%,var(--brand) 42%,var(--brand-mid) 88%);
  color:#fff;
  box-shadow:0 8px 32px rgba(6,8,24,.35);
  border-bottom:3px solid var(--gold);
  margin-bottom:20px;
}
.page-head-inner{
  max-width:1180px;
  margin:0 auto;
  padding:18px 20px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}
.brand-lockup{
  display:flex;
  align-items:center;
  gap:18px;
  min-width:0;
}
.brand-logo-wrap{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 14px;
  background:rgba(255,255,255,.97);
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
}
.brand-logo{
  display:block;
  height:44px;
  width:auto;
  max-width:min(200px,42vw);
  object-fit:contain;
}
.brand-text{min-width:0}
header.page-head h1{
  font-size:clamp(1.1rem,2.6vw,1.5rem);
  font-weight:800;
  color:#fff;
  letter-spacing:.02em;
  text-shadow:0 1px 2px rgba(0,0,0,.2);
}
header.page-head .sub{
  font-size:0.82rem;
  color:rgba(255,255,255,.82);
  margin-top:6px;
  white-space:nowrap;
  max-width:none;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:2px;
}
.head-deco{
  flex-shrink:0;
  opacity:.92;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));
}
.head-deco img{
  display:block;
  height:clamp(40px,8vw,64px);
  width:auto;
  object-fit:contain;
  filter:brightness(0) invert(1);
}

.map-shell{
  max-width:1180px;
  margin:0 auto;
  padding:0 16px 28px;
  position:relative;
}
.map-frame{
  position:relative;
  border-radius:var(--radius-lg);
  padding:2px;
  background:linear-gradient(145deg,rgba(197,160,89,.55),rgba(26,35,126,.25),rgba(255,255,255,.4));
  box-shadow:var(--shadow-lift);
}
#map{
  width:100%;
  height:auto;
  display:block;
  background:linear-gradient(165deg,#e2e9f2 0%,#d4dde8 50%,#c9d5e3 100%);
  border-radius:calc(var(--radius-lg) - 2px);
  touch-action:none;
}
path.country{stroke:#fff;stroke-width:0.35;vector-effect:non-scaling-stroke;transition:opacity .18s,filter .18s}
path.country.is--muted{pointer-events:none}
.legend{
  position:absolute;
  left:18px;
  bottom:16px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:12px 14px;
  border-radius:var(--radius-md);
  font-size:0.72rem;
  box-shadow:var(--shadow-soft);
  border:1px solid rgba(26,35,126,.1);
  max-width:min(360px,92vw);
}
.legend h3{
  font-size:0.78rem;
  color:var(--brand);
  margin-bottom:10px;
  font-weight:800;
}
.legend-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px}
button.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
  color:#374151;
  font:inherit;
  font-size:inherit;
  border:none;
  background:transparent;
  cursor:pointer;
  text-align:left;
  padding:5px 8px;
  margin:0;
  width:100%;
  border-radius:8px;
  transition:background .12s,color .12s;
}
button.legend-item:hover{background:rgba(26,35,126,.08);color:var(--brand)}
button.legend-item:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.legend-swatch{width:12px;height:12px;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);pointer-events:none}
.legend-item-label{pointer-events:none}
.region-panel{
  position:absolute;
  top:16px;
  right:16px;
  width:min(300px,calc(100% - 32px));
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-radius:var(--radius-md);
  padding:16px 16px 14px;
  box-shadow:var(--shadow-lift);
  border:1px solid rgba(26,35,126,.12);
  display:none;
  z-index:5;
}
.region-panel.is--open{display:block}
.region-panel h2{
  font-size:1.08rem;
  font-weight:800;
  color:var(--ink);
  margin-bottom:8px;
  padding-bottom:8px;
  border-bottom:2px solid var(--brand-soft);
}
.region-panel .hint{font-size:0.74rem;color:var(--muted);line-height:1.5;margin-bottom:12px}
.region-panel .actions{display:flex;flex-direction:column;gap:10px}
a.btn-report{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:10px;
  font-weight:800;
  font-size:0.92rem;
  text-decoration:none;
  background:linear-gradient(180deg,var(--brand-mid) 0%,var(--brand) 100%);
  color:#fff;
  border:none;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(26,35,126,.35);
  transition:transform .12s,box-shadow .15s,filter .15s;
}
a.btn-report:hover{
  filter:brightness(1.06);
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(26,35,126,.4);
}
button.btn-report[disabled],.btn-report.is--disabled{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:10px;
  font-weight:700;
  font-size:0.88rem;
  background:linear-gradient(180deg,#f3f4f8,#e8eaef);
  color:#8b909e;
  border:1px dashed #c5c9d4;
  cursor:not-allowed;
}
button.btn-back{
  margin-top:2px;
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid rgba(26,35,126,.15);
  background:#fafbff;
  font-size:0.84rem;
  font-weight:700;
  color:var(--brand);
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
button.btn-back:hover{background:var(--brand-soft);border-color:var(--brand)}
.region-country-sidebar{
  position:absolute;
  top:16px;
  left:16px;
  width:min(232px,calc(44vw - 12px));
  max-height:calc(100% - 32px);
  overflow:auto;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-radius:var(--radius-md);
  padding:14px 14px 12px;
  box-shadow:var(--shadow-lift);
  border:1px solid rgba(26,35,126,.1);
  display:none;
  z-index:6;
}
.region-country-sidebar.is--open{display:block}
.region-country-sidebar h3{
  font-size:0.8rem;
  font-weight:800;
  color:var(--brand);
  margin-bottom:10px;
  line-height:1.35;
  padding-bottom:8px;
  border-bottom:2px solid var(--brand-soft);
}
.region-country-sidebar ul{list-style:none;padding:0;margin:0}
.region-country-sidebar li{margin-bottom:6px;font-size:0.78rem;line-height:1.45}
.region-country-sidebar a.country-list-link{
  color:var(--brand);
  font-weight:600;
  text-decoration:none;
  border-bottom:1px solid rgba(26,35,126,.35);
  word-break:break-word;
  transition:color .12s,border-color .12s;
}
.region-country-sidebar a.country-list-link:hover{color:var(--brand-mid);border-bottom-color:var(--brand-mid)}
.region-country-sidebar button.country-list-pending{
  background:none;border:none;padding:0;margin:0;font:inherit;
  color:var(--brand);font-weight:600;text-align:left;cursor:pointer;
  text-decoration:none;border-bottom:1px dashed rgba(26,35,126,.3);
  width:100%;word-break:break-word;
  transition:color .12s;
}
.region-country-sidebar button.country-list-pending:hover{color:var(--brand-mid)}
.region-country-sidebar .pending-tag{color:#6b7280;font-weight:600;text-decoration:none;border:none}
#tooltip{
  position:fixed;pointer-events:none;z-index:20;
  background:linear-gradient(180deg,#252842,#1a1a2e);
  color:#fff;padding:8px 12px;border-radius:8px;
  font-size:0.75rem;font-weight:600;
  opacity:0;transform:translate(-50%,-120%);
  transition:opacity .1s;
  white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.1);
}
#tooltip.is--on{opacity:1}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:30;
  background:linear-gradient(180deg,#252842,#1a1a2e);
  color:#fff;padding:12px 20px;border-radius:12px;
  font-size:0.82rem;font-weight:600;
  opacity:0;transition:opacity .22s;
  max-width:min(420px,92vw);text-align:center;pointer-events:none;
  box-shadow:0 10px 36px rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.08);
}
#toast.is--on{opacity:1}

@media (max-width:720px){
  .page-head-inner{flex-direction:column;align-items:flex-start}
  .head-deco{align-self:flex-end;margin-top:-8px}
  .brand-lockup{width:100%}
  header.page-head .sub{white-space:normal}
}
</style>

    "036": "澳大利亚", "554": "新西兰",
  };

  function countryListLabel(id) {
    const en = COUNTRY_DISPLAY[id] || id;
    const zh = COUNTRY_DISPLAY_ZH[id];
    return zh ? en + " " + zh : en;
  }

  const COUNTRY_DASHBOARDS = {
    "076": OMI + "brazil-tc-parc-dashboard.html",
    "484": OMI + "mexico-tc-parc-dashboard.html",
  };

  const FILL_REGION_NO_DATA = "#bbdefb";

  const width = 960;
  const height = 560;

  function countryId(f) {
    if (f.id == null || f.id === "") return null;
    return String(f.id).padStart(3, "0");
  }

  function getRegion(f) {
    const id = countryId(f);
    if (id != null) return COUNTRY_TO_REGION[id];
    const n = f.properties && f.properties.name;
    if (n === "N. Cyprus") return "俄土中东大区";
    if (n === "Somaliland") return "非洲";
    if (n === "Kosovo") return "欧洲";
    return null;
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("is--on");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.classList.remove("is--on"); }, 2400);
  }

  const svg = d3.select("#map");
  const g = svg.append("g").attr("class", "map-inner");
  const tooltip = document.getElementById("tooltip");
  const regionPanel = document.getElementById("regionPanel");
  const regionTitle = document.getElementById("regionTitle");
  const regionHint = document.getElementById("regionHint");
  const reportLink = document.getElementById("reportLink");
  const reportDisabled = document.getElementById("reportDisabled");
  const btnBack = document.getElementById("btnBack");
  const regionCountrySidebar = document.getElementById("regionCountrySidebar");
  const regionCountryList = document.getElementById("regionCountryList");
  const legendGrid = document.getElementById("legendGrid");

  const projection = d3.geoNaturalEarth1();
  const path = d3.geoPath(projection);
  let countries;
  let currentMode = "world";
  let selectedRegion = null;

  const zoom = d3
    .zoom()
    .scaleExtent([1, 22])
    .filter(function (event) {
      if (currentMode === "world") return false;
      return !event.ctrlKey || event.type !== "wheel";
    })
    .on("zoom", function (event) {
      g.attr("transform", event.transform);
    });
  svg.call(zoom);

  function worldFill(d) {
    const r = getRegion(d);
    if (r == null) return "#dde3ea";
    const id = countryId(d);
    const base = d3.color(REGION_COLORS[r]);
    if (!base) return "#ccc";
    const c = base.copy();
    c.opacity = id && DATA_COUNTRIES.has(id) ? 1 : 0.55;
    return c.formatRgb();
  }

  function applyWorldStyle(selection) {
    selection
      .attr("fill", worldFill)
      .attr("class", function (d) {
        const r = getRegion(d);
        return "country" + (r == null ? " is--muted" : "");
      })
      .style("cursor", function (d) {
        return getRegion(d) ? "pointer" : "default";
      });
  }

  function applyRegionStyle(selection, region) {
    selection
      .attr("class", function (d) {
        const r = getRegion(d);
        const muted = r !== region ? " country is--muted" : " country";
        return muted;
      })
      .attr("fill", function (d) {
        const r = getRegion(d);
        if (r !== region) return "#eceff4";
        const id = countryId(d);
        if (id && DATA_COUNTRIES.has(id)) return "#1a237e";
        return FILL_REGION_NO_DATA;
      })
      .style("cursor", function (d) {
        const r = getRegion(d);
        if (r !== region) return "default";
        const id = countryId(d);
        return id && DATA_COUNTRIES.has(id) ? "pointer" : "default";
      });
  }

  function boundsTransform(bounds, maxK) {
    const dx = bounds[1][0] - bounds[0][0];
    const dy = bounds[1][1] - bounds[0][1];
    const x = (bounds[0][0] + bounds[1][0]) / 2;
    const y = (bounds[0][1] + bounds[1][1]) / 2;
    let k = 0.88 / Math.max(dx / width, dy / height, 1e-6);
    if (k > maxK) k = maxK;
    return d3.zoomIdentity.translate(width / 2 - k * x, height / 2 - k * y).scale(k);
  }

  function enterRegion(region) {
    selectedRegion = region;
    currentMode = "region";
    const feats = countries.features.filter(function (f) { return getRegion(f) === region; });
    if (!feats.length) return;
    const coll = { type: "FeatureCollection", features: feats };
    const b = path.bounds(coll);
    const t = boundsTransform(b, 20);
    g.selectAll("path.country").call(applyRegionStyle, region);
    svg.transition().duration(900).ease(d3.easeCubicOut).call(zoom.transform, t);

    regionTitle.textContent = region;
    regionHint.textContent = "深蓝色为已覆盖数据的国家；浅蓝色为同大区暂无数据的国家。";
    renderRegionCountryList(region);
    const href = REGION_REPORTS[region];
    if (href) {
      reportLink.href = href;
      reportLink.style.display = "inline-flex";
      reportDisabled.style.display = "none";
    } else {
      reportLink.style.display = "none";
      reportDisabled.style.display = "inline-flex";
    }
    regionPanel.classList.add("is--open");
    document.getElementById("legend").style.opacity = "0.35";
  }

  function renderRegionCountryList(region) {
    regionCountryList.innerHTML = "";
    const rows = [];
    const seen = new Set();
    countries.features.forEach(function (f) {
      const id = countryId(f);
      if (!id || !DATA_COUNTRIES.has(id)) return;
      if (getRegion(f) !== region) return;
      if (seen.has(id)) return;
      seen.add(id);
      rows.push({
        id: id,
        nameEn: COUNTRY_DISPLAY[id] || id,
        label: countryListLabel(id),
      });
    });
    if (region === "东南亚" && DATA_COUNTRIES.has("702") && !seen.has("702")) {
      rows.push({
        id: "702",
        nameEn: COUNTRY_DISPLAY["702"],
        label: countryListLabel("702"),
      });
    }
    rows.sort(function (a, b) {
      return a.nameEn.localeCompare(b.nameEn, "en");
    });
    rows.forEach(function (row) {
      const li = document.createElement("li");
      const url = COUNTRY_DASHBOARDS[row.id];
      if (url) {
        const a = document.createElement("a");
        a.className = "country-list-link";
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = row.label;
        li.appendChild(a);
      } else {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "country-list-pending";
        btn.innerHTML =
          row.label + ' <span class="pending-tag">(报告准备中)</span>';
        btn.addEventListener("click", function () {
          showToast("该国单品报告 / 仪表盘尚未发布（报告准备中）");
        });
        li.appendChild(btn);
      }
      regionCountryList.appendChild(li);
    });
    regionCountrySidebar.classList.add("is--open");
  }

  function exitRegion() {
    selectedRegion = null;
    currentMode = "world";
    regionPanel.classList.remove("is--open");
    regionCountrySidebar.classList.remove("is--open");
    regionCountryList.innerHTML = "";
    document.getElementById("legend").style.opacity = "1";
    g.selectAll("path.country").call(applyWorldStyle);
    svg.transition().duration(700).ease(d3.easeCubicInOut).call(zoom.transform, d3.zoomIdentity);
  }

  function onCountryClick(event, d) {
    const region = getRegion(d);
    if (!region) return;
    event.stopPropagation();
    if (currentMode === "world") {
      enterRegion(region);
      return;
    }
    if (currentMode === "region" && region === selectedRegion) {
      const id = countryId(d);
      if (!id || !DATA_COUNTRIES.has(id)) return;
      const url = COUNTRY_DASHBOARDS[id];
      if (url) window.open(url, "_blank", "noopener,noreferrer");
      else showToast("该国单品仪表盘尚未发布（报告准备中）");
    }
  }

  function onCountryMove(event, d) {
    const r = getRegion(d);
    if (!r || currentMode !== "world") {
      tooltip.classList.remove("is--on");
      return;
    }
    tooltip.textContent = r;
    tooltip.style.left = event.clientX + "px";
    tooltip.style.top = event.clientY + "px";
    tooltip.classList.add("is--on");
  }

  function onCountryLeave() {
    tooltip.classList.remove("is--on");
  }

  btnBack.addEventListener("click", exitRegion);

  Promise.all([
    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
  ]).then(function (results) {
    const world = results[0];
    countries = topojson.feature(world, world.objects.countries);
    const landOnly = {
      type: "FeatureCollection",
      features: countries.features.filter(function (f) { return getRegion(f) != null; }),
    };
    projection.fitExtent([[12, 10], [width - 12, height - 8]], landOnly);

    g.selectAll("path.country")
      .data(countries.features, function (d) { return countryId(d) || d.properties.name; })
      .join("path")
      .attr("class", "country")
      .attr("d", path)
      .call(applyWorldStyle)
      .on("click", onCountryClick)
      .on("mousemove", onCountryMove)
      .on("mouseleave", onCountryLeave);

    legendGrid.innerHTML = "";
    REGION_ORDER.forEach(function (name) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "legend-item";
      btn.setAttribute("aria-label", "进入大区：" + name);
      const sw = document.createElement("span");
      sw.className = "legend-swatch";
      sw.setAttribute("aria-hidden", "true");
      sw.style.background = REGION_COLORS[name];
      const lab = document.createElement("span");
      lab.className = "legend-item-label";
      lab.textContent = name;
      btn.appendChild(sw);
      btn.appendChild(lab);
      btn.addEventListener("click", function () {
        enterRegion(name);
      });
      legendGrid.appendChild(btn);
    });
  }).catch(function (e) {
    console.error(e);
    showToast("地图数据加载失败，请检查网络或使用本地 HTTP 服务打开本页");
  });
})();
</script>
</body>
</html>
